<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <meta
      name="description"
      content="지금 극장에서 상영 중인 영화를 만나보세요."
    />
    <title>무비플릭스 | 지금 상영 중</title>
    <link rel="preconnect" href="https://image.tmdb.org" />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#" aria-label="GIHWAN-MOVIE FLIX 홈">GIHWAN-MOVIE FLIX</a>
      <nav class="main-nav" aria-label="주 메뉴">
        <a class="active" href="#home">홈</a>
        <a href="#movies">현재 상영작</a>
      </nav>
      <label class="search-box">
        <span class="sr-only">영화 검색</span>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="10.8" cy="10.8" r="6.8"></circle>
          <path d="m16 16 5 5"></path>
        </svg>
        <input id="search-input" type="search" placeholder="영화 검색" autocomplete="off" />
      </label>
    </header>

    <main id="home">
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-backdrop" id="hero-backdrop"></div>
        <div class="hero-shade"></div>
        <div class="hero-content">
          <p class="eyebrow"><span class="live-dot"></span> 지금 극장에서</p>
          <p class="hero-kicker">오늘의 추천 영화</p>
          <h1 id="hero-title">최신 영화를 불러오는 중</h1>
          <p class="hero-overview" id="hero-overview">
            잠시만 기다려 주세요. 지금 상영 중인 영화를 찾고 있어요.
          </p>
          <div class="hero-actions">
            <a class="button button-primary" href="#movies">
              <span aria-hidden="true">▶</span> 영화 둘러보기
            </a>
            <a class="button button-secondary" href="#movies">
              <span aria-hidden="true">ⓘ</span> 상영작 보기
            </a>
          </div>
        </div>
        <div class="hero-caption">영화 정보 제공 <span>TMDB</span></div>
      </section>

      <section class="catalog section-wrap" id="movies" aria-labelledby="movies-title">
        <div class="section-heading">
          <div>
            <p class="section-kicker">SCREENING NOW</p>
            <h2 id="movies-title">현재 상영작</h2>
          </div>
          <div class="carousel-controls" aria-label="영화 목록 이동">
            <button class="arrow-button" id="scroll-left" type="button" aria-label="이전 영화">
              ‹
            </button>
            <button class="arrow-button" id="scroll-right" type="button" aria-label="다음 영화">
              ›
            </button>
          </div>
        </div>
        <p class="status-message" id="status-message" role="status">영화 정보를 불러오고 있어요...</p>
        <div class="movie-grid" id="movie-grid" aria-live="polite"></div>
      </section>
    </main>

    <footer class="site-footer">
      <p>영화 포스터와 정보는 TMDB에서 제공하며, TMDB의 보증이나 인증을 받지 않았습니다.</p>
      <a href="https://www.themoviedb.org/" target="_blank" rel="noreferrer">TMDB 알아보기 ↗</a>
    </footer>
  </body>
</html>
